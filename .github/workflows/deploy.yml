name: CI/CD

on:
  push:
    branches:
      - main
      - dev
      - cicd/#61
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      # application.properties
      - name: application.properties 설정
        run: |
          set +x
          touch src/main/resources/application.properties
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > src/main/resources/application.properties

      # Docker 로그인
      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/tripbridge-server:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/tripbridge-server:latest

      # EC2 인스턴스
      - name: EC2 배포
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set +x
            echo "${{ secrets.APPLICATION_PROPERTIES }}" | sed 's/^[ \t]*//;s/[ \t]*$//' > /home/ubuntu/.env
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tripbridge-server:latest
            docker stop tripbridge-container || true
            docker rm -f tripbridge-container || true
            fuser -k 8080/tcp || true
            docker run -it -d --name tripbridge-container -p 8080:8080 \
            --env-file /home/ubuntu/.env \
            ${{ secrets.DOCKERHUB_USERNAME }}/tripbridge-server:latest