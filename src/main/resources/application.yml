spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

  security:
    jwt:
      access:
        token:
        secret: ${JWT_ACCESS}
        expired: 3600
      refresh:
        token:
        secret: ${JWT_REFRESH}
        expired: 86400

  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        open-in-view: false

#s3
cloud:
  aws:
    s3:
      bucket: ${BUCKET_NAME}
    credentials:
      access-key: ${BUCKET_ACCESS}
      secret-key: ${BUCKET_SECRET}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

openai:
  model: gpt-3.5-turbo
  api:
    key: ${OPENAI_API_KEY}
    url: "https://api.openai.com/v1/chat/completions"
